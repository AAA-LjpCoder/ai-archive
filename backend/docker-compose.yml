# AI档案室 后端服务编排（本地开发）
# 用法: docker compose up -d
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ai-archive-db
    environment:
      POSTGRES_USER: aiarchive
      POSTGRES_PASSWORD: aiarchive_dev_pw
      POSTGRES_DB: aiarchive
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiarchive"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
